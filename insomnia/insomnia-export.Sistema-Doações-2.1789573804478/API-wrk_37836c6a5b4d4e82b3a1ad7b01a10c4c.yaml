collection:
  - name: Assistidos
    meta:
      id: fld_assistidos
      sortKey: -5000
      description: Fluxo CRUD de assistidos.
    children:
      - url: "{{ _.BASE_URL }}/api/assistidos"
        name: 01 - Listar assistidos
        meta:
          id: req_assistidos_list
          sortKey: -5050
        method: GET
        scripts:
          afterResponse: |
            const body = insomnia.response.json();
            insomnia.test('status 200', () => insomnia.expect(insomnia.response.code).to.eql(200));
            insomnia.test('retorna uma lista', () => insomnia.expect(body.data).to.be.an('array'));
      - url: "{{ _.BASE_URL }}/api/assistidos"
        name: 02 - Criar assistido
        meta:
          id: req_assistidos_create
          sortKey: -5040
        method: POST
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: '{"nome":"Assistido Insomnia","uf":"SP","renda":1200.5}'
        scripts:
          afterResponse: |
            const body = insomnia.response.json();
            insomnia.test('status 201', () => insomnia.expect(insomnia.response.code).to.eql(201));
            insomnia.test('servidor gera o id', () => insomnia.expect(body.data.id).to.be.a('string'));
            insomnia.environment.set('ASSISTIDO_CREATED_ID', body.data.id);
      - url: "{{ _.BASE_URL }}/api/assistidos/{{ _.ASSISTIDO_CREATED_ID }}"
        name: 03 - Consultar assistido criado
        meta:
          id: req_assistidos_get
          sortKey: -5030
        method: GET
        scripts:
          afterResponse: |
            const body = insomnia.response.json();
            insomnia.test('status 200', () => insomnia.expect(insomnia.response.code).to.eql(200));
            insomnia.test('id corresponde ao criado', () => insomnia.expect(body.data.id).to.eql(insomnia.environment.get('ASSISTIDO_CREATED_ID')));
      - url: "{{ _.BASE_URL }}/api/assistidos/{{ _.ASSISTIDO_CREATED_ID }}"
        name: 04 - Atualizar assistido
        meta:
          id: req_assistidos_update
          sortKey: -5020
        method: PATCH
        headers:
          - name: Content-Type
            value: application/json
        body:
          mimeType: application/json
          text: '{"nome":"Assistido Insomnia Atualizado"}'
        scripts:
          afterResponse: |
            const body = insomnia.response.json();
            insomnia.test('status 200', () => insomnia.expect(insomnia.response.code).to.eql(200));
            insomnia.test('nome foi atualizado', () => insomnia.expect(body.data.nome).to.eql('Assistido Insomnia Atualizado'));
      - url: "{{ _.BASE_URL }}/api/assistidos/{{ _.ASSISTIDO_CREATED_ID }}"
